name: Deploy Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HEROKU_APP: virtualmall-frontend
  IMAGE: registry.heroku.com/virtualmall-frontend/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Login to Heroku Container Registry
        run: heroku container:login

      # Classic docker build/push (not Buildx push) so Heroku gets
      # Docker Manifest V2 Schema 2 instead of an OCI index.
      - name: Bump build number
        id: build_number
        run: |
          current="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "BUILD_NUMBER is not an integer: ${current}"
            exit 1
          fi
          next=$((current + 1))
          echo "$next" > BUILD_NUMBER
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Frontend build ${next}"

      - name: Build web image
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_OAUTH_CLIENT_ID: ${{ secrets.VITE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_CLEANTER_URL: ${{ secrets.VITE_CLEANTER_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL secret is empty."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "VITE_GOOGLE_MAPS_API_KEY secret is empty."
            exit 1
          fi
          echo "Building with VITE_API_URL=${VITE_API_URL} VITE_BUILD_NUMBER=${{ steps.build_number.outputs.next }}"
          docker build --platform linux/amd64 \
            -f Dockerfile.heroku \
            -t "${{ env.IMAGE }}" \
            --build-arg VITE_API_URL="${VITE_API_URL}" \
            --build-arg VITE_OAUTH_CLIENT_ID="${VITE_OAUTH_CLIENT_ID}" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${VITE_GOOGLE_MAPS_API_KEY}" \
            --build-arg VITE_CARTO_API_KEY="${VITE_CARTO_API_KEY}" \
            --build-arg VITE_CLEANTER_URL="${VITE_CLEANTER_URL:-http://localhost:9200}" \
            --build-arg VITE_BUILD_NUMBER="${{ steps.build_number.outputs.next }}" \
            .

      - name: Push web image
        run: docker push "${{ env.IMAGE }}"

      - name: Release web container
        run: heroku container:release web --app "${{ env.HEROKU_APP }}"

      - name: Commit last pushed build number
        run: |
          git add BUILD_NUMBER
          git diff --cached --quiet && exit 0
          GIT_AUTHOR_NAME="github-actions[bot]" \
          GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          git commit -m "chore: frontend build ${{ steps.build_number.outputs.next }} [skip ci]"
          git push
